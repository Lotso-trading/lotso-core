version: "3.8"

services:
  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-polymarket_copy}
    volumes:
      - mongodb_swarm_data:/data/db
    networks:
      - backend-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  api:
    image: polymarket-api:latest
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongodb:27017/${MONGO_INITDB_DATABASE:-polymarket_copy}?authSource=admin
      API_PORT: 3000
      API_HOST: 0.0.0.0
    ports:
      - target: 3000
        published: 3000
        mode: host
      - target: 3001
        published: 3001
        mode: host
    networks:
      - backend-net
      - frontend-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  bot:
    image: polymarket-bot:latest
    environment:
      API_INTERNAL_URL: http://api:3000
    networks:
      - backend-net
    deploy:
      # IMPORTANT : 1 seul réplica pour le bot afin d'éviter les doubles exécutions d'ordres
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M

  dashboard:
    image: polymarket-dashboard:latest
    ports:
      - target: 80
        published: 5173
        protocol: tcp
        mode: ingress
    networks:
      - frontend-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  backend-net:
    driver: overlay
    attachable: true
  frontend-net:
    driver: overlay
    attachable: true

volumes:
  mongodb_swarm_data:
    driver: local
